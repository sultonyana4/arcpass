[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200

# EVM version compatible with Arc Network
evm_version = "paris"

# Fuzz testing configuration
[fuzz]
runs = 256
max_test_rejects = 65536
seed = "0x1"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
