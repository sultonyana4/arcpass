services:
  postgres:
    image: postgres:16-alpine
    ports:
       - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: arcpass_dev
      POSTGRES_USER: arcpass
      POSTGRES_PASSWORD: arcpass_local
    volumes:
      - arcpass_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcpass -d arcpass_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://arcpass:arcpass_local@postgres:5432/arcpass_dev?schema=public
      PORT: "4000"
      NODE_ENV: production
      LOG_LEVEL: info
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://web:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://arcpass:arcpass_local@postgres:5432/arcpass_dev?schema=public
      CHAIN_RPC_URL: ${CHAIN_RPC_URL:-${ARC_RPC_URL:-https://rpc.testnet.arc.network}}
      SPONSOR_PRIVATE_KEY: ${SPONSOR_PRIVATE_KEY:-${DEPLOYER_PRIVATE_KEY:-}}
      POLL_INTERVAL_MS: 5000
      BATCH_SIZE: 20
      MAX_RETRIES: 5
      RELAY_FAILURE_RATE: "0.0"
      LOCK_TIMEOUT_MS: 30000
      SHUTDOWN_TIMEOUT_MS: 10000
      CHAIN_ID: ${CHAIN_ID:-5042002}
      CONTRACT_ADDRESS_SPONSOR_VAULT: ${CONTRACT_ADDRESS_SPONSOR_VAULT:-0x0000000000000000000000000000000000000000}
      CONTRACT_ADDRESS_SPONSORSHIP_REGISTRY: ${CONTRACT_ADDRESS_SPONSORSHIP_REGISTRY:-0x0000000000000000000000000000000000000000}
      SPONSORSHIP_AMOUNT_WEI: ${SPONSORSHIP_AMOUNT_WEI:-1000000000000000}
      CHAIN_ID_VERIFY_TIMEOUT_MS: ${CHAIN_ID_VERIFY_TIMEOUT_MS:-10000}
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_SPONSOR_VAULT_ADDRESS: ${NEXT_PUBLIC_SPONSOR_VAULT_ADDRESS:-}
        NEXT_PUBLIC_SPONSORSHIP_REGISTRY_ADDRESS: ${NEXT_PUBLIC_SPONSORSHIP_REGISTRY_ADDRESS:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      API_URL_INTERNAL: http://api:4000
      NEXT_PUBLIC_EXPLORER_URL: ${NEXT_PUBLIC_EXPLORER_URL:-https://testnet.arcscan.app/tx/}
      NEXT_PUBLIC_SPONSOR_VAULT_ADDRESS: ${NEXT_PUBLIC_SPONSOR_VAULT_ADDRESS:-}
      NEXT_PUBLIC_SPONSORSHIP_REGISTRY_ADDRESS: ${NEXT_PUBLIC_SPONSORSHIP_REGISTRY_ADDRESS:-}
      NEXT_PUBLIC_GITHUB_URL: ${NEXT_PUBLIC_GITHUB_URL:-}
      NODE_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  arcpass_pgdata:
